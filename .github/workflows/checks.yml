name: CPU checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install Pillow
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile __init__.py configuration.py worker.py glb_material.py
      - run: bash -n install-runtime.sh
      - run: python worker.py --help
